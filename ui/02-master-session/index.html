<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiCam — Session Master</title>
<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.7/dist/quartz/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
:root{--g:rgba(17,24,39,.50);--gs:rgba(17,24,39,.65);--b:rgba(255,255,255,.20);--m:rgba(255,255,255,.68)}html,body{min-height:100%;margin:0;background:#111827;color:#fff}.root{position:relative;min-height:100vh;overflow:hidden}.preview{position:fixed;inset:0;background:#111827;z-index:0}.preview video{width:100%;height:100%;object-fit:cover}.shell{position:relative;z-index:2;max-width:680px;margin:auto;min-height:100vh;padding:14px 12px 22px;display:flex;flex-direction:column}.glass{background:var(--g)!important;border:1px solid var(--b)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.strong{background:var(--gs)!important}.muted{color:var(--m)}.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}.mainbtn{min-height:55px;font-size:1.05rem;font-weight:600}.mode-create,.mode-join{display:none}body.create .mode-create,body.join .mode-join{display:block}.pin-wrap{display:flex;gap:.55rem;justify-content:center}.pin-digit{width:56px;height:64px;padding:0;text-align:center;font-size:1.65rem;font-weight:700}.pin-error{min-height:24px}
</style>
</head>
<body><div class="root"><div class="preview"><video autoplay muted loop playsinline preload="auto"><source src="../assets/02B31CAD-F08A-4DB5-9021-9EDAA6A945C7.mp4" type="video/mp4"></video></div><main class="shell">
<header class="d-flex align-items-center gap-3 mb-4"><a href="../01-session-discovery/" class="btn btn-outline-light glass icon"><i class="fa-solid fa-arrow-left"></i></a><div><div class="fw-bold fs-4 mode-create">Nouvelle session</div><div class="fw-bold fs-4 mode-join">Rejoindre</div><div class="small muted">Cam 07</div></div></header>
<section class="mode-create"><div class="card glass strong rounded-4"><div class="card-body p-3"><label for="sessionNameCreate" class="form-label">Nom de la session</label><input id="sessionNameCreate" class="form-control form-control-lg" autocomplete="off" placeholder="Nom de la session"><div id="nameError" class="small text-warning mt-2 d-none">Le nom de la session est obligatoire.</div></div></div><div class="card glass strong rounded-4 mt-4"><div class="card-body p-2"><button id="createSession" type="button" class="btn btn-success w-100 mainbtn"><i class="fa-solid fa-plus me-2"></i>Créer</button></div></div></section>
<section class="mode-join"><div class="card glass strong rounded-4"><div class="card-body p-3"><div id="sessionName" class="fs-5 fw-semibold text-center mb-4">Interview Studio A</div><div class="pin-wrap"><input class="form-control pin-digit" inputmode="numeric" maxlength="1" autocomplete="one-time-code"><input class="form-control pin-digit" inputmode="numeric" maxlength="1"><input class="form-control pin-digit" inputmode="numeric" maxlength="1"><input class="form-control pin-digit" inputmode="numeric" maxlength="1"></div><div id="pinError" class="pin-error small text-warning text-center mt-3"></div></div></div></section>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function(){
 const p=new URLSearchParams(location.search),mode=p.get('mode')==='join'?'join':'create';document.body.classList.add(mode);
 if(p.get('session')==='salle-2')$('#sessionName').text('Captation Salle 2');
 $('#createSession').on('click',function(){const name=$('#sessionNameCreate').val().trim();if(!name){$('#nameError').removeClass('d-none');$('#sessionNameCreate').focus();return}$('#nameError').addClass('d-none');location.href='../03-master-session/?created=1';});
 $('#sessionNameCreate').on('input',()=>$('#nameError').addClass('d-none'));
 const $digits=$('.pin-digit');
 $digits.on('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,1);const i=$digits.index(this);if(this.value&&i<3)$digits.eq(i+1).focus();if($digits.toArray().every(el=>el.value.length===1)){const pin=$digits.map((_,el)=>el.value).get().join('');if(pin==='4281'){location.href='../03-master-session/';}else{$('#pinError').text('PIN incorrect');setTimeout(function(){$digits.val('');$digits.eq(0).focus();},250);setTimeout(()=>$('#pinError').text(''),1800);}}});
 $digits.on('keydown',function(e){const i=$digits.index(this);if(e.key==='Backspace'&&!this.value&&i>0)$digits.eq(i-1).focus();});
 if(mode==='join')setTimeout(()=>$digits.eq(0).focus(),100);
});
</script></body></html>
