<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiCam — Accueil device</title>
<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.7/dist/quartz/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
:root{--g:rgba(17,24,39,.46);--gs:rgba(17,24,39,.64);--b:rgba(255,255,255,.2);--m:rgba(255,255,255,.68)}
html,body{min-height:100%;margin:0;background:#111827;color:#fff}.root{position:relative;min-height:100vh;overflow:hidden}.preview{position:fixed;inset:0;z-index:0;overflow:hidden;background:#111827}.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.18),rgba(0,0,0,.03) 35%,rgba(0,0,0,.48))}.shell{position:relative;z-index:2;max-width:760px;margin:auto;padding:14px 12px 22px;min-height:100vh;display:flex;flex-direction:column}.glass{background:var(--g)!important;border:1px solid var(--b)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.strong{background:var(--gs)!important}.muted{color:var(--m)}.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center}.cap{font-size:.76rem;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.13);border-radius:999px;padding:.3rem .55rem}.cap.off{opacity:.38;filter:grayscale(1);background:rgba(255,255,255,.04)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#45d483}.menu{display:none}.menu.open{display:block}.mainbtn{min-height:54px;font-size:1.05rem;font-weight:600}
</style>
</head>
<body>
<div class="root">
<div class="preview"><video autoplay muted loop playsinline preload="auto"><source src="../assets/02B31CAD-F08A-4DB5-9021-9EDAA6A945C7.mp4" type="video/mp4"></video></div><div class="vig"></div>
<main class="shell">
<header class="d-flex align-items-center gap-3 mb-3"><div class="rounded-4 glass d-flex align-items-center justify-content-center" style="width:46px;height:46px"><i class="fa-solid fa-video"></i></div><div class="flex-grow-1"><div class="fw-bold fs-4">MultiCam</div><div class="small muted">Cam 07</div></div><button id="menuButton" class="btn btn-outline-light glass icon"><i class="fa-solid fa-bars"></i></button></header>
<section class="card glass strong rounded-4 mb-3"><div class="card-body p-3"><div class="d-flex align-items-center gap-2 mb-3"><span class="dot"></span><span class="fw-semibold">Disponible sur le réseau</span></div><div id="skillBadges" class="d-flex flex-wrap gap-2"></div></div></section>
<section id="masterArea" class="flex-grow-1"><div class="d-flex align-items-center justify-content-between mb-3"><div class="small text-uppercase muted">Sessions disponibles</div><button id="refresh" class="btn btn-outline-light glass icon"><i class="fa-solid fa-rotate"></i></button></div><div class="vstack gap-3"><article class="card glass rounded-4"><div class="card-body p-3 d-flex align-items-center gap-3"><i class="fa-solid fa-tower-broadcast fs-4"></i><div class="flex-grow-1"><div class="fw-semibold text-truncate">Interview Studio A</div><div class="small muted">4 appareils présents</div></div><a class="btn btn-outline-light" href="../02-master-session/?mode=join&session=studio-a">Rejoindre</a></div></article><article class="card glass rounded-4"><div class="card-body p-3 d-flex align-items-center gap-3"><i class="fa-solid fa-tower-broadcast fs-4"></i><div class="flex-grow-1"><div class="fw-semibold text-truncate">Captation Salle 2</div><div class="small muted">12 appareils présents</div></div><a class="btn btn-outline-light" href="../02-master-session/?mode=join&session=salle-2">Rejoindre</a></div></article></div></section>
<div id="menu" class="card glass strong rounded-4 mt-3 menu"><div class="card-body p-2"><button class="btn btn-link text-light text-decoration-none w-100 text-start"><i class="fa-solid fa-clock-rotate-left me-2"></i>Historique</button><button id="settingsSkills" class="btn btn-link text-light text-decoration-none w-100 text-start"><i class="fa-solid fa-gear me-2"></i>Paramètres</button></div></div>
<div id="newSession" class="card glass strong rounded-4 mt-4"><div class="card-body p-2"><a href="../02-master-session/?mode=create" class="btn btn-success w-100 mainbtn"><i class="fa-solid fa-plus me-2"></i>Nouvelle session</a></div></div>
</main></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(function(){
  /* Mock de l'etat persistant du device. Dans l'app, ces valeurs viennent des parametres locaux. */
  const supportedSkills=['capture','storage','controller'];
  const enabledSkills=['capture','storage','controller'];
  const icons={capture:'fa-video',storage:'fa-hard-drive',controller:'fa-sliders'};
  const names={capture:'Capture',storage:'Storage',controller:'Master'};
  function renderSkills(){
    $('#skillBadges').html(supportedSkills.map(function(s){
      const active=enabledSkills.includes(s);
      return '<span class="cap '+(active?'':'off')+'"><i class="fa-solid '+icons[s]+' me-1"></i>'+names[s]+'</span>';
    }).join(''));
    const isMaster=enabledSkills.includes('controller');
    $('#masterArea,#newSession').toggle(isMaster);
  }
  renderSkills();
  $('#settingsSkills').on('click',function(){ window.location.href='../15-device-settings/'; });
  $('#menuButton').on('click',()=>$('#menu').toggleClass('open'));
  $('#refresh').on('click',function(){let b=$(this),h=b.html();b.prop('disabled',true).html('<i class="fa-solid fa-spinner fa-spin"></i>');setTimeout(()=>b.prop('disabled',false).html(h),700)});
});
</script>
</body>
</html>
