<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiCam — Accueil / Découverte des sessions</title>

  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.7/dist/quartz/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --mc-glass: rgba(17, 24, 39, 0.46);
      --mc-glass-strong: rgba(17, 24, 39, 0.60);
      --mc-border: rgba(255,255,255,.20);
      --mc-muted: rgba(255,255,255,.68);
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #111827;
      color: #fff;
    }

    body { overflow-x: hidden; }

    .mc-root {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    .mc-preview-sim {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.36)),
        linear-gradient(135deg, #745d87 0%, #405163 48%, #17252d 100%);
    }

    .mc-preview-sim::before,
    .mc-preview-sim::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(16px);
      opacity: .65;
    }

    .mc-preview-sim::before {
      width: 180px;
      height: 180px;
      background: #9cd9ff;
      right: 8%;
      top: 10%;
    }

    .mc-preview-sim::after {
      width: 220px;
      height: 220px;
      background: #ffc97b;
      right: 10%;
      bottom: 8%;
    }

    .mc-scene {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .92;
    }

    .mc-scene .stage {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 8%;
      height: 34%;
      background: rgba(35, 31, 40, .95);
      border-radius: 28px;
      filter: blur(2px);
    }

    .mc-scene .person-a,
    .mc-scene .person-b {
      position: absolute;
      bottom: 22%;
      width: 110px;
      height: 270px;
      background: #1d1e23;
      border-radius: 56px;
      filter: blur(1px);
    }

    .mc-scene .person-a { left: 18%; }
    .mc-scene .person-b { right: 20%; height: 240px; }

    .mc-scene .head-a,
    .mc-scene .head-b {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #c2a08f;
      filter: blur(1px);
    }

    .mc-scene .head-a { left: 18%; bottom: 47%; }
    .mc-scene .head-b { right: 20%; bottom: 44%; }

    .mc-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,.04) 35%, rgba(0,0,0,.45));
    }

    .mc-shell {
      position: relative;
      z-index: 2;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .mc-glass {
      background: var(--mc-glass) !important;
      border: 1px solid var(--mc-border) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 26px rgba(0,0,0,.18);
    }

    .mc-glass-strong { background: var(--mc-glass-strong) !important; }
    .mc-muted { color: var(--mc-muted); }

    .mc-section-title {
      font-size: .76rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.64);
    }

    .mc-session-card .btn { min-width: 102px; }

    .mc-icon-btn {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mc-main-btn {
      min-height: 54px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .mc-menu { display: none; }
    .mc-menu.is-open { display: block; }

    @media (max-width: 420px) {
      .mc-session-card .d-flex { align-items: stretch !important; }
      .mc-session-card .btn { min-width: 94px; }
    }
  </style>
</head>
<body>
  <div class="mc-root">
    <div class="mc-preview-sim" aria-hidden="true">
      <div class="mc-scene">
        <div class="stage"></div>
        <div class="person-a"></div>
        <div class="head-a"></div>
        <div class="person-b"></div>
        <div class="head-b"></div>
      </div>
    </div>

    <div class="mc-vignette" aria-hidden="true"></div>

    <main class="mc-shell">
      <header class="d-flex align-items-center gap-3 mb-4">
        <div class="rounded-4 mc-glass d-flex align-items-center justify-content-center" style="width:46px;height:46px;">
          <i class="fa-solid fa-video"></i>
        </div>

        <div class="flex-grow-1 min-w-0">
          <div class="fw-bold fs-4 lh-sm">MultiCam</div>
          <div class="small mc-muted">Cam 07</div>
        </div>

        <button id="menuButton" type="button" class="btn btn-outline-light mc-glass mc-icon-btn" aria-label="Ouvrir le menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </header>

      <section class="flex-grow-1">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div>
            <div class="mc-section-title">Sessions détectées</div>
            <div class="small mc-muted mt-1">Réseau local</div>
          </div>

          <button id="refreshButton" type="button" class="btn btn-outline-light mc-glass mc-icon-btn" aria-label="Actualiser les sessions">
            <i class="fa-solid fa-rotate"></i>
          </button>
        </div>

        <div class="vstack gap-3" id="sessionList">
          <article class="card mc-glass rounded-4 mc-session-card">
            <div class="card-body p-3">
              <div class="d-flex align-items-center gap-3">
                <div class="fs-4"><i class="fa-solid fa-tower-broadcast"></i></div>
                <div class="flex-grow-1 min-w-0">
                  <div class="fw-semibold fs-5 text-truncate">Interview Studio A</div>
                  <div class="small mc-muted mt-1"><i class="fa-solid fa-tablet-screen-button me-1"></i>4 appareils présents</div>
                </div>
                <button type="button" class="btn btn-outline-light">Rejoindre</button>
              </div>
            </div>
          </article>

          <article class="card mc-glass rounded-4 mc-session-card">
            <div class="card-body p-3">
              <div class="d-flex align-items-center gap-3">
                <div class="fs-4"><i class="fa-solid fa-tower-broadcast"></i></div>
                <div class="flex-grow-1 min-w-0">
                  <div class="fw-semibold fs-5 text-truncate">Captation Salle 2</div>
                  <div class="small mc-muted mt-1"><i class="fa-solid fa-tablet-screen-button me-1"></i>12 appareils présents</div>
                </div>
                <button type="button" class="btn btn-outline-light">Rejoindre</button>
              </div>
            </div>
          </article>
        </div>

        <div class="text-center mt-4">
          <button type="button" class="btn btn-outline-light mc-glass">
            <i class="fa-solid fa-qrcode me-2"></i>
            Rejoindre par code / QR
          </button>
        </div>

        <div id="deviceMenu" class="card mc-glass mc-glass-strong rounded-4 mt-3 mc-menu">
          <div class="card-body p-2">
            <button type="button" class="btn btn-link text-light text-decoration-none w-100 text-start py-2">
              <i class="fa-solid fa-clock-rotate-left me-2"></i>
              Historique des sessions
            </button>
            <button type="button" class="btn btn-link text-light text-decoration-none w-100 text-start py-2">
              <i class="fa-solid fa-gear me-2"></i>
              Paramètres de ce device
            </button>
          </div>
        </div>
      </section>

      <div class="card mc-glass mc-glass-strong rounded-4 mt-4">
        <div class="card-body p-2">
          <button type="button" class="btn btn-success w-100 mc-main-btn rounded-3">
            <i class="fa-solid fa-plus me-2"></i>
            Nouvelle session
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $(function () {
      $('#menuButton').on('click', function () {
        $('#deviceMenu').toggleClass('is-open');
      });

      $('#refreshButton').on('click', function () {
        const $button = $(this);
        const original = $button.html();
        $button.prop('disabled', true);
        $button.html('<i class="fa-solid fa-spinner fa-spin"></i>');
        setTimeout(function () {
          $button.prop('disabled', false);
          $button.html(original);
        }, 900);
      });
    });
  </script>
</body>
</html>
